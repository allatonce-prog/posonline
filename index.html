<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="POS System - Point of Sale with Inventory Management">
  <meta name="theme-color" content="#6366f1">
  <title>POS System - Login</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="prefetch" href="about.html">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Modern Dark Theme Login Styles -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      position: relative;
      overflow: hidden;
    }

    /* Animated gradient background */
    .login-wrapper::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
      animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Animated particles */
    .bg-shapes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .bg-shape {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
      backdrop-filter: blur(10px);
      animation: float 15s infinite ease-in-out;
      box-shadow: 0 8px 32px 0 rgba(99, 102, 241, 0.2);
    }

    .bg-shape:nth-child(1) {
      width: 100px;
      height: 100px;
      top: 10%;
      left: 15%;
      animation-delay: 0s;
      animation-duration: 20s;
    }

    .bg-shape:nth-child(2) {
      width: 150px;
      height: 150px;
      top: 70%;
      right: 15%;
      animation-delay: 3s;
      animation-duration: 25s;
    }

    .bg-shape:nth-child(3) {
      width: 80px;
      height: 80px;
      bottom: 15%;
      left: 25%;
      animation-delay: 6s;
      animation-duration: 18s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px) translateX(0px) rotate(0deg);
        opacity: 0.3;
      }

      33% {
        transform: translateY(-30px) translateX(20px) rotate(120deg);
        opacity: 0.6;
      }

      66% {
        transform: translateY(-15px) translateX(-20px) rotate(240deg);
        opacity: 0.4;
      }
    }

    /* Login container with glassmorphism */
    .login-container {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border-radius: 0;
      border: none;
      box-shadow: none;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 440px;
      animation: slideInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      z-index: 1;
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Header */
    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    /* Modern icon logo */
    .login-logo {
      width: 250px;
      height: auto;
      background: transparent;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: none;
      animation: none;
      position: relative;
      overflow: visible;
    }

    .login-logo img {
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.3));
    }

    .login-logo::before {
      display: none;
    }

    @keyframes logoFloat {

      0%,
      100% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(-10px) rotate(5deg);
      }
    }

    @keyframes shine {
      0% {
        transform: translateX(-100%) translateY(-100%) rotate(45deg);
      }

      100% {
        transform: translateX(100%) translateY(100%) rotate(45deg);
      }
    }

    .login-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .login-header p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.95rem;
      font-weight: 400;
    }

    /* Form */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      position: relative;
    }

    .form-group label {
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.875rem;
      letter-spacing: 0.3px;
      margin-left: 0.25rem;
    }

    /* Modern input with icon */
    .input-icon {
      position: absolute;
      left: 1.25rem;
      top: 2.85rem;
      font-size: 1.25rem;
      z-index: 2;
      transition: all 0.3s ease;
      color: #ffffff;
      opacity: 0.8;
    }

    .form-group input:focus+.input-icon,
    .form-group:focus-within .input-icon {
      opacity: 1;
      transform: scale(1.1);
      color: #ffffff;
    }

    .form-group input#password {
      padding-right: 3rem;
    }

    .password-toggle {
      position: absolute;
      right: 1rem;
      top: 2.85rem;
      font-size: 1.25rem;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 5;
    }

    .password-toggle:hover {
      color: white;
      transform: scale(1.1);
    }

    .form-group input {
      width: 100%;
      padding: 1rem 1.25rem 1rem 3.5rem;
      border: none;
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 0;
      font-size: 1rem;
      font-family: inherit;
      background: transparent;
      color: #ffffff;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .form-group input:hover {
      border-bottom-color: rgba(255, 255, 255, 0.4);
      background: transparent;
    }

    .form-group input:focus {
      outline: none;
      border-bottom-color: #667eea;
      background: transparent;
      box-shadow: none;
      transform: translateY(-2px);
    }

    /* Modern gradient button */
    .login-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 1.125rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      margin-top: 0.5rem;
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3),
        0 5px 10px rgba(0, 0, 0, 0.2);
      letter-spacing: 0.5px;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .login-btn:hover::before {
      left: 100%;
    }

    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4),
        0 8px 15px rgba(0, 0, 0, 0.3);
    }

    .login-btn:active {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }

    .login-btn.loading {
      pointer-events: none;
      opacity: 0.8;
    }

    .login-btn.loading::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 22px;
      height: 22px;
      margin: -11px 0 0 -11px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Messages */
    .error-message {
      background: rgba(239, 68, 68, 0.15);
      backdrop-filter: blur(10px);
      color: #fca5a5;
      padding: 1rem 1.25rem;
      border-radius: 12px;
      font-size: 0.875rem;
      text-align: center;
      margin-top: 1rem;
      border: 1px solid rgba(239, 68, 68, 0.3);
      display: none;
      animation: shake 0.5s ease;
    }

    .error-message.show {
      display: block;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-8px);
      }

      75% {
        transform: translateX(8px);
      }
    }

    .success-message {
      background: rgba(16, 185, 129, 0.15);
      backdrop-filter: blur(10px);
      color: #6ee7b7;
      padding: 1rem 1.25rem;
      border-radius: 12px;
      font-size: 0.875rem;
      text-align: center;
      margin-top: 1rem;
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: none;
    }

    .success-message.show {
      display: block;
      animation: slideInUp 0.4s ease;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-wrapper {
        padding: 1rem;
      }

      .login-container {
        padding: 2rem 1.5rem;
        border-radius: 20px;
      }

      .login-header h1 {
        font-size: 1.5rem;
      }

      .login-logo {
        width: 200px;
        height: auto;
        font-size: 2.2rem;
      }

      .form-group input {
        padding: 0.875rem 1rem 0.875rem 3.25rem;
      }

      .login-btn {
        padding: 1rem 1.5rem;
      }
    }

    .login-footer {
      position: absolute;
      bottom: 2rem;
      left: 0;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.75rem;
      letter-spacing: 1px;
      z-index: 10;
    }

    .info-icon-link {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.5rem;
      z-index: 100;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: rgba(255, 255, 255, 0.08);
      width: 48px;
      /* Larger hit target */
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      touch-action: manipulation;
      /* No tap delay */
      -webkit-tap-highlight-color: transparent;
    }

    .info-icon-link:hover {
      color: white;
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.1);
    }

    .trusted-partners {
      position: absolute;
      bottom: 2rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      z-index: 10;
    }

    .trusted-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
    }

    .slider-container {
      width: 100%;
      max-width: 320px;
      overflow: hidden;
      position: relative;
      /* Fade edges */
      /* Fade edges */
      -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
      mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
      cursor: grab;
      touch-action: none;
      /* Prevent scroll while dragging */
    }

    .slider-container:active {
      cursor: grabbing;
    }

    .slider-track {
      display: flex;
      align-items: center;
      gap: 2rem;
      width: max-content;
      will-change: transform;
      /* Animation handled by JS */
    }

    .partner-logo {
      height: 40px;
      width: 40px;
      object-fit: cover;
      opacity: 0.9;
      filter: none;
      transition: all 0.3s ease;
      border-radius: 50%;
      background: white;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    .partner-logo:hover {
      filter: none;
      opacity: 1;
      transform: scale(1.1);
    }

    @keyframes scrollRight {
      0% {
        transform: translateX(-50%);
      }

      100% {
        transform: translateX(0);
      }
    }

    /* Status Modal */
    .status-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .status-modal.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: rgba(15, 23, 42, 0.8);
      /* Darker bg for contrast */
      backdrop-filter: blur(20px);
      padding: 2.5rem;
      border-radius: 20px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      min-width: 320px;
      max-width: 90%;
    }

    .status-modal.show .modal-content {
      transform: scale(1);
      opacity: 1;
    }

    .modal-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-title {
      font-size: 1.5rem;
      color: white;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .modal-message {
      color: rgba(255, 255, 255, 0.7);
      font-size: 1rem;
    }

    /* Unlock Animation */
    @keyframes unlock {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }

      50% {
        transform: scale(1.1);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .icon-success {
      color: #4ade80;
      animation: unlock 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Error Animation */
    @keyframes shakeLock {

      0%,
      100% {
        transform: translateX(0);
      }

      15% {
        transform: translateX(-15px) rotate(-5deg);
      }

      30% {
        transform: translateX(15px) rotate(5deg);
      }

      45% {
        transform: translateX(-10px) rotate(-3deg);
      }

      60% {
        transform: translateX(10px) rotate(3deg);
      }

      75% {
        transform: translateX(-5px);
      }
    }

    .icon-error {
      color: #ef4444;
      animation: shakeLock 0.5s ease-in-out;
    }

    /* Caps Lock Warning */
    .caps-lock-warning {
      color: #fbbf24;
      font-size: 0.8rem;
      margin-top: 5px;
      display: none;
      align-items: center;
      gap: 5px;
      position: absolute;
      bottom: -25px;
      left: 0;
      width: 100%;
      font-weight: 500;
    }

    .caps-lock-warning.show {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    /* Typewriter Greeting */
    .typewriter-text {
      text-align: center;
      font-family: inherit;
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.95rem;
      margin-top: 1.5rem;
      min-height: 1.5em;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background-color: rgba(255, 255, 255, 0.8);
      vertical-align: middle;
      animation: blink 1s infinite;
      margin-left: 2px;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    /* Recent Users */
    .recent-users {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
      min-height: 20px;
    }

    .user-avatar {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s;
      position: relative;
    }

    .user-avatar:hover {
      transform: translateY(-5px);
    }

    .avatar-circle {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: white;
      backdrop-filter: blur(5px);
      margin-bottom: 0.5rem;
      transition: all 0.2s;
      text-transform: uppercase;
    }

    .user-avatar:hover .avatar-circle {
      background: rgba(255, 255, 255, 0.25);
      border-color: #667eea;
      box-shadow: 0 0 15px rgba(102, 126, 234, 0.5);
    }

    .avatar-name {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.8);
      max-width: 70px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remove-user {
      position: absolute;
      top: -2px;
      right: -2px;
      background: #ef4444;
      color: white;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 2;
    }

    .user-avatar:hover .remove-user {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="login-wrapper">
    <!-- Info Icon -->
    <a href="about.html" class="info-icon-link" aria-label="About Us">
      <i class="ph ph-info"></i>
    </a>

    <!-- Animated background -->


    <div class="login-container">
      <div class="login-header">
        <div class="login-logo">
          <img src="css/logo/jen%20(1).png" alt="Logo">
        </div>
      </div>

      <!-- Recent Users (Injected by JS) -->
      <div class="recent-users" id="recentUsers"></div>

      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" required
            autocomplete="username">
          <span class="input-icon"><i class="ph ph-user"></i></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required
            autocomplete="current-password">
          <span class="input-icon"><i class="ph ph-lock-key"></i></span>
          <span class="password-toggle" id="togglePassword">
            <i class="ph ph-eye"></i>
          </span>
          <div class="caps-lock-warning" id="capsWarning">
            <i class="ph ph-warning-circle"></i> Caps Lock is ON
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span id="btnText">Sign In</span>
        </button>

        <div id="typewriterGreeting" class="typewriter-text"></div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
      </form>
    </div>
    <div class="trusted-partners">
      <div class="trusted-label">Trusted by</div>
      <div class="slider-container">
        <div class="slider-track">
          <!-- Set 1 -->
          <img src="partners/arribahomestay.jpg" class="partner-logo" alt="Arriba">
          <img src="partners/gliconstruction.jpg" class="partner-logo" alt="GLI">
          <img src="partners/justarabica.jpg" class="partner-logo" alt="Just Arabica">
          <img src="partners/lifecheck.jpg" class="partner-logo" alt="LifeCheck">

          <!-- Set 2 (Duplicate for loop) -->
          <img src="partners/arribahomestay.jpg" class="partner-logo" alt="Arriba">
          <img src="partners/gliconstruction.jpg" class="partner-logo" alt="GLI">
          <img src="partners/justarabica.jpg" class="partner-logo" alt="Just Arabica">
          <img src="partners/lifecheck.jpg" class="partner-logo" alt="LifeCheck">

          <!-- Set 3 (Extra buffer) -->
          <img src="partners/arribahomestay.jpg" class="partner-logo" alt="Arriba">
          <img src="partners/gliconstruction.jpg" class="partner-logo" alt="GLI">
          <img src="partners/justarabica.jpg" class="partner-logo" alt="Just Arabica">
          <img src="partners/lifecheck.jpg" class="partner-logo" alt="LifeCheck">

          <!-- Set 4 (Complete Loop) -->
          <img src="partners/arribahomestay.jpg" class="partner-logo" alt="Arriba">
          <img src="partners/gliconstruction.jpg" class="partner-logo" alt="GLI">
          <img src="partners/justarabica.jpg" class="partner-logo" alt="Just Arabica">
          <img src="partners/lifecheck.jpg" class="partner-logo" alt="LifeCheck">
        </div>
      </div>
    </div>
  </div>



  <!-- Animated Status Modal -->
  <div id="statusModal" class="status-modal">
    <div class="modal-content">
      <div id="modalIcon" class="modal-icon"></div>
      <h3 id="modalTitle" class="modal-title"></h3>
      <p id="modalMessage" class="modal-message"></p>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/offline-db.js"></script>
  <script src="js/pagination.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/admin/settings.js"></script>
  <script>
    // Apply custom settings to login page
    document.addEventListener('DOMContentLoaded', () => {
      // Password Toggle Logic
      const togglePassword = document.querySelector('#togglePassword');
      const password = document.querySelector('#password');

      if (togglePassword && password) {
        togglePassword.addEventListener('click', function (e) {
          // toggle the type attribute
          const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
          password.setAttribute('type', type);

          // toggle the eye icon
          const icon = this.querySelector('i');
          if (type === 'password') {
            icon.classList.remove('ph-eye-slash');
            icon.classList.add('ph-eye');
          } else {
            icon.classList.remove('ph-eye');
            icon.classList.add('ph-eye-slash');
          }
        });
      }

      // Caps Lock Detection
      if (password) {
        const capsWarning = document.getElementById('capsWarning');
        function checkCapsLock(e) {
          if (e.getModifierState && e.getModifierState('CapsLock')) {
            capsWarning.classList.add('show');
          } else {
            capsWarning.classList.remove('show');
          }
        }
        password.addEventListener('keyup', checkCapsLock);
        password.addEventListener('keydown', checkCapsLock);
        password.addEventListener('click', checkCapsLock);
        password.addEventListener('focus', checkCapsLock);
        password.addEventListener('blur', () => capsWarning.classList.remove('show'));
      }

      // Apply settings from localStorage
      if (typeof applyLoginSettings === 'function') {
        applyLoginSettings();
      }

      // Partner Slider Interactive Logic
      const track = document.querySelector('.slider-track');
      const container = document.querySelector('.slider-container');

      if (track && container) {
        let pos = 0;
        let isDragging = false;
        let startX = 0;
        let velocity = 0;

        // Start correctly
        function initSlider() {
          pos = -track.scrollWidth / 2;
          requestAnimationFrame(animate);
        }

        // Wait for images (ensure width is correct)
        if (document.readyState === 'complete') {
          setTimeout(initSlider, 100);
        } else {
          window.addEventListener('load', () => setTimeout(initSlider, 100));
        }

        function animate() {
          const w = track.scrollWidth;
          const half = w / 2;

          if (!isDragging) {
            pos += 0.5; // Auto Speed
          }

          // Infinite Loop Logic
          // Range: [-half, 0]
          if (pos >= 0) {
            pos = -half + (pos % half);
          }
          if (pos < -half) {
            pos = 0 - (Math.abs(pos) % half);
          }

          track.style.transform = `translateX(${pos}px)`;
          requestAnimationFrame(animate);
        }

        // Touch Events
        container.addEventListener('touchstart', (e) => {
          isDragging = true;
          startX = e.touches[0].clientX;
        }, { passive: false });

        container.addEventListener('touchmove', (e) => {
          if (!isDragging) return;
          const x = e.touches[0].clientX;
          const diff = x - startX;
          pos += diff;
          startX = x;
          e.preventDefault();
        }, { passive: false });

        container.addEventListener('touchend', () => {
          isDragging = false;
        });

        // Mouse Events
        container.addEventListener('mousedown', (e) => {
          isDragging = true;
          startX = e.clientX;
        });
        window.addEventListener('mousemove', (e) => {
          if (!isDragging) return;
          const x = e.clientX;
          const diff = x - startX;
          pos += diff;
          startX = x;
        });
        window.addEventListener('mouseup', () => {
          isDragging = false;
        });
      }
    });

    // Initialize database and handle login
    document.addEventListener('DOMContentLoaded', async () => {
      // Check if already logged in
      if (auth.isAuthenticated()) {
        const user = auth.getCurrentUser();
        if (user.role === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'cashier.html';
        }
        return;
      }

      // Initialize database
      showLoading('Initializing system...');
      try {
        await db.init();
        await db.initializeDefaults();
        hideLoading();
      } catch (error) {
        hideLoading();
        showMessage('Error initializing system: ' + error.message, 'error');
      }

      // Handle login form
      const loginForm = document.getElementById('loginForm');
      const loginBtn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
          showMessage('Please enter username and password', 'error');
          return;
        }

        // Show loading state
        loginBtn.classList.add('loading');
        btnText.textContent = 'Signing in...';
        hideMessage();

        try {
          const user = await auth.login(username, password);

          hideMessage();
          showMessage('Login successful! Redirecting...', 'success');

          // Save to Recent Users
          saveRecentUser(username);

          // Redirect based on role
          setTimeout(() => {
            if (user.role === 'admin') {
              window.location.href = 'admin.html';
            } else {
              window.location.href = 'cashier.html';
            }
          }, 1000);

        } catch (error) {
          showMessage(error.message, 'error');
          loginBtn.classList.remove('loading');
          btnText.textContent = 'Sign In';
        }
      });

      // Show message function
      // Show message function (Enhanced Modal)
      function showMessage(message, type) {
        hideMessage();

        const modal = document.getElementById('statusModal');
        const iconContainer = document.getElementById('modalIcon');
        const title = document.getElementById('modalTitle');
        const msg = document.getElementById('modalMessage');

        if (type === 'success') {
          title.textContent = 'Welcome Back!';
          msg.textContent = 'Logging you in...';
          // Unlock Icon
          iconContainer.innerHTML = '<i class="ph ph-lock-key-open"></i>';
          iconContainer.className = 'modal-icon icon-success';
        } else {
          // Error
          title.textContent = 'Access Denied';
          msg.textContent = message;
          // Lock Icon (Closed)
          iconContainer.innerHTML = '<i class="ph ph-lock-key"></i>';
          iconContainer.className = 'modal-icon icon-error';

          // Auto hide error after 2.5s
          setTimeout(() => {
            modal.classList.remove('show');
          }, 2500);
        }

        // Show modal
        requestAnimationFrame(() => modal.classList.add('show'));
      }

      // Hide message function
      function hideMessage() {
        const modal = document.getElementById('statusModal');
        if (modal) modal.classList.remove('show');

        // Clear legacy (just in case)
        if (errorMessage) errorMessage.classList.remove('show');
        if (successMessage) successMessage.classList.remove('show');
      }

      // Register service worker with force update
      if ('serviceWorker' in navigator) {
        // First, unregister any old service workers
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (let registration of registrations) {
            registration.unregister().then(() => {
              console.log('Old service worker unregistered');
            });
          }
        });

        // Clear all caches
        caches.keys().then(cacheNames => {
          return Promise.all(
            cacheNames.map(cacheName => {
              if (cacheName.startsWith('pos-system-')) {
                console.log('Deleting old cache:', cacheName);
                return caches.delete(cacheName);
              }
            })
          );
        });

        // Register new service worker
        setTimeout(() => {
          navigator.serviceWorker.register('sw.js')
            .then(registration => {
              console.log('Service Worker v3 registered:', registration);

              // Force update check
              registration.update();

              // Listen for updates
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                console.log('New service worker found, installing...');

                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'activated') {
                    console.log('New service worker activated!');
                    // Reload to use new service worker
                    if (!navigator.serviceWorker.controller) {
                      window.location.reload();
                    }
                  }
                });
              });
            })
            .catch(error => {
              console.log('Service Worker registration failed:', error);
            });
        }, 1000);
      }

      // PWA install prompt
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;

        // Show install button or notification
        setTimeout(() => {
          if (confirm('Install POS System as an app?')) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
              if (choiceResult.outcome === 'accepted') {
                console.log('User accepted the install prompt');
              }
              deferredPrompt = null;
            });
          }
        }, 3000);
      });
    });
    // Recent Users Logic
    function saveRecentUser(username) {
      let users = JSON.parse(localStorage.getItem('recent_pos_users') || '[]');
      users = users.filter(u => u.username !== username); // Remove dupe
      users.unshift({ username, lastLogin: Date.now() }); // Add to top
      if (users.length > 3) users.pop(); // Keep max 3
      localStorage.setItem('recent_pos_users', JSON.stringify(users));
    }

    function renderRecentUsers() {
      const container = document.getElementById('recentUsers');
      if (!container) return;

      const users = JSON.parse(localStorage.getItem('recent_pos_users') || '[]');

      if (users.length === 0) {
        container.style.display = 'none';
        return;
      }

      container.style.display = 'flex';
      container.innerHTML = users.map(u => `
            <div class="user-avatar" onclick="window.selectUser('${u.username}')">
                <div class="remove-user" onclick="window.removeUser('${u.username}', event)"><i class="ph ph-x"></i></div>
                <div class="avatar-circle">${u.username.substring(0, 2).toUpperCase()}</div>
                <span class="avatar-name">${u.username}</span>
            </div>
        `).join('');
    }

    // Global helpers attached to window
    window.selectUser = (name) => {
      const input = document.getElementById('username');
      input.value = name;
      input.focus();
      document.getElementById('password').focus();
    };
    window.removeUser = (name, e) => {
      e.stopPropagation();
      let users = JSON.parse(localStorage.getItem('recent_pos_users') || '[]');
      users = users.filter(u => u.username !== name);
      localStorage.setItem('recent_pos_users', JSON.stringify(users));
      renderRecentUsers();
    };

    // Initial Render
    document.addEventListener('DOMContentLoaded', () => {
      renderRecentUsers();
      initTypewriter();
    });

    // Typewriter Logic
    function initTypewriter() {
      const greetingEl = document.getElementById('typewriterGreeting');
      if (!greetingEl) return;

      const hour = new Date().getHours();
      let text = "";

      // 12 am - 5 am (0 - 5)
      if (hour >= 0 && hour < 6) text = "Maayong Kadlawn Bai !";
      // 6 am - 10 am (6 - 10)
      else if (hour >= 6 && hour < 11) text = "Maayong Buntag Bai !";
      // 11 am - 1 pm (11 - 13)
      else if (hour >= 11 && hour < 14) text = "Maayong Udto Bai !";
      // 2 pm - 5 pm (14 - 17)
      else if (hour >= 14 && hour < 18) text = "Maayong Hapon Bai !";
      // 6 pm - 11:59 pm (18 - 23)
      else text = "Maayong Gabie Bai !";

      let i = 0;
      let isDeleting = false;

      function loop() {
        greetingEl.innerHTML = text.substring(0, i) + '<span class="cursor"></span>';

        if (!isDeleting && i < text.length) {
          // Typing
          i++;
          setTimeout(loop, 100);
        } else if (!isDeleting && i === text.length) {
          // Finished Typing -> Wait
          isDeleting = true;
          setTimeout(loop, 2000);
        } else if (isDeleting && i > 0) {
          // Deleting
          i--;
          setTimeout(loop, 50);
        } else {
          // Finished Deleting -> Restart
          isDeleting = false;
          setTimeout(loop, 500);
        }
      }

      loop();
    }
  </script>
</body>

</html>
